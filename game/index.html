<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>AURELIA BAY — Open-World Crime Game</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0d1218; }
  body { font-family: Arial, Helvetica, sans-serif; color: #f2f2ee; }
  #app, #app canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { position: absolute; inset: 0; pointer-events: none; }
  .panel {
    background: rgba(16, 20, 26, 0.82);
    border: 1px solid rgba(255, 255, 255, 0.10);
    border-radius: 10px;
    padding: 10px 12px;
    backdrop-filter: blur(2px);
  }
  .hidden { display: none !important; }

  /* Mission card, top-left */
  #mission-card { position: absolute; top: 14px; left: 14px; width: 348px; }
  .mission-job { color: #ffd21f; font-weight: bold; font-size: 13px; letter-spacing: 0.5px; }
  .mission-title { font-size: 22px; font-weight: bold; margin: 2px 0 4px; }
  .mission-brief { font-size: 13px; line-height: 1.4; color: #d8d8d2; }
  .mission-progress { height: 6px; background: rgba(255,255,255,0.15); border-radius: 3px; margin: 8px 0 6px; }
  #mission-bar { height: 100%; background: #ffd21f; border-radius: 3px; width: 50%; }
  .mission-stage { font-size: 12px; color: #ffb0a0; }
  .mission-next { font-size: 12px; color: #9fd4e8; margin-top: 2px; }

  /* Money / stars / clock, top-right */
  #money-bar { position: absolute; top: 14px; right: 14px; text-align: right; }
  .money { font-size: 30px; font-weight: bold; text-shadow: 0 2px 6px rgba(0,0,0,0.6); }
  .stars { font-size: 20px; color: #ffd21f; letter-spacing: 3px; text-shadow: 0 2px 6px rgba(0,0,0,0.6); }
  .clock { font-size: 14px; font-weight: bold; color: #e8e8e8; text-shadow: 0 2px 6px rgba(0,0,0,0.6); }
  .in-sight { display: none; font-size: 12px; font-weight: bold; color: #ff6b5e; margin-top: 2px; text-shadow: 0 2px 6px rgba(0,0,0,0.6); }

  /* Weapons, left */
  #weapons { position: absolute; top: 196px; left: 14px; width: 188px; padding: 6px; }
  .weapon { display: flex; align-items: center; gap: 8px; padding: 5px 6px; border-radius: 6px; font-size: 13px; }
  .weapon.selected { background: rgba(255, 210, 31, 0.22); outline: 1px solid #ffd21f; }
  .wkey { background: #ffd21f; color: #111; font-weight: bold; font-size: 11px; border-radius: 4px; padding: 2px 6px; }
  .wname { flex: 1; font-weight: bold; }
  .wammo { color: #ffd21f; font-weight: bold; }

  /* Dispatch + crew, right */
  #dispatch { position: absolute; top: 108px; right: 14px; width: 300px; }
  .dispatch-head { display: flex; justify-content: space-between; color: #ff8a7a; font-weight: bold; font-size: 13px; margin-bottom: 6px; }
  .dispatch-row { display: flex; justify-content: space-between; font-size: 12px; padding: 2px 0; }
  .dispatch-row .role { color: #ffd21f; }
  .dispatch-foot { font-size: 11px; color: #9fd4e8; margin-top: 5px; }
  #vera-card { position: absolute; top: 218px; right: 14px; width: 300px; display: flex; gap: 10px; align-items: center; }
  .crew-card img { width: 48px; height: 48px; border-radius: 8px; flex-shrink: 0; }
  .crew-name { color: #ffd21f; font-weight: bold; font-size: 13px; }
  .crew-quote { font-size: 12px; font-style: italic; color: #d8d8d2; line-height: 1.35; }
  #crew-cards { position: absolute; top: 296px; right: 14px; width: 300px; display: flex; flex-direction: column; gap: 6px; }
  #crew-cards .crew-card { display: flex; gap: 10px; align-items: center; position: relative; }
  .crew-body { flex: 1; }
  .crew-desc { font-size: 11px; color: #c8c8c2; line-height: 1.3; }
  .crew-key { background: #ffd21f; color: #111; font-weight: bold; font-size: 11px; border-radius: 4px; padding: 2px 6px; }
  .crew-ready { font-size: 10px; font-weight: bold; color: #7fe07f; }
  .crew-ready.cooling { color: #ff8a7a; }

  /* Minimap, bottom-left */
  #minimap-wrap { position: absolute; left: 14px; bottom: 14px; }
  #minimap { border-radius: 50%; box-shadow: 0 4px 18px rgba(0,0,0,0.5); }
  #district-label { margin-top: 6px; width: 220px; }
  .district-name { font-weight: bold; font-size: 15px; }
  .district-street { font-size: 12px; color: #c8c8c2; }
  .district-rep { font-size: 11px; color: #ffd21f; font-weight: bold; margin-top: 3px; }
  .district-bar { height: 5px; background: rgba(255,255,255,0.15); border-radius: 3px; margin-top: 4px; }
  #district-bar-fill { height: 100%; background: #ffd21f; border-radius: 3px; }

  /* Stats, bottom-right */
  #stats { position: absolute; right: 14px; bottom: 14px; width: 250px; text-align: right; }
  .stat-row { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: bold; margin-bottom: 3px; }
  .stat-row span { width: 58px; text-align: right; color: #d8d8d2; }
  .stat-bar { flex: 1; height: 8px; background: rgba(255,255,255,0.18); border-radius: 4px; overflow: hidden; }
  .stat-bar .fill { height: 100%; border-radius: 4px; }
  .fill.health { background: #5fd06a; }
  .fill.armour { background: #4fa8e0; }
  .fill.rep { background: #ffd21f; }
  .stat-row b { width: 34px; }
  .rep-level { font-size: 11px; font-weight: bold; color: #ffd21f; margin: 2px 0; }
  .speed { font-size: 44px; font-weight: bold; line-height: 1; text-shadow: 0 2px 8px rgba(0,0,0,0.6); }
  .speed span { font-size: 14px; margin-left: 4px; }
  .car-name { font-size: 15px; font-weight: bold; }
  .car-condition { font-size: 11px; color: #9fd4e8; }
  .radio { font-size: 12px; color: #ffd21f; margin-top: 4px; }

  /* Dialogue, bottom-center */
  #dialogue { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); width: 460px; display: flex; gap: 10px; align-items: center; }
  #dialogue img { width: 44px; height: 44px; border-radius: 8px; }
  .dialogue-from { color: #ffd21f; font-weight: bold; font-size: 12px; }
  .dialogue-text { font-size: 13px; line-height: 1.35; }

  /* Score popup, center */
  #popup { position: absolute; left: 50%; top: 34%; transform: translate(-50%, -50%); text-align: center; opacity: 0; }
  #popup.pop { animation: popfade 2.2s ease-out forwards; }
  #popup.pinned { opacity: 1 !important; animation: none !important; }
  .popup-main { font-size: 44px; font-weight: bold; color: #ffd21f; text-shadow: 0 3px 10px rgba(0,0,0,0.7); }
  .popup-sub { font-size: 18px; font-weight: bold; color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,0.7); }
  @keyframes popfade { 0% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); } 12% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); } 20% { transform: translate(-50%, -50%) scale(1); } 75% { opacity: 1; } 100% { opacity: 0; } }

  .prompt { display: none; position: absolute; left: 50%; bottom: 108px; transform: translateX(-50%); background: rgba(16,20,26,0.9); border: 1px solid #ffd21f; border-radius: 8px; padding: 8px 16px; font-weight: bold; font-size: 14px; }
  .hint { position: absolute; left: 50%; bottom: 92px; transform: translateX(-50%); font-size: 11px; color: rgba(255,255,255,0.75); text-shadow: 0 1px 4px rgba(0,0,0,0.8); white-space: nowrap; }
  #vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 62%, rgba(0,0,0,0.28) 100%); }

  /* Start screen */
  #start-screen { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,14,20,0.55) 0%, rgba(10,14,20,0.25) 45%, rgba(10,14,20,0.75) 100%); display: flex; flex-direction: column; justify-content: center; padding: 0 8%; pointer-events: auto; }
  .title-block { margin-bottom: 30px; }
  .game-title { font-size: 84px; font-weight: bold; letter-spacing: 2px; background: linear-gradient(180deg, #ffe9a8, #ff7a3d); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: 0 4px 24px rgba(0,0,0,0.35); line-height: 1; }
  .game-sub { font-size: 17px; font-weight: bold; letter-spacing: 6px; color: #7fd4e8; margin-top: 6px; }
  .start-menu { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; margin-bottom: 28px; }
  .menu-item { background: none; border: none; color: #fff; font-family: inherit; font-size: 26px; font-weight: bold; letter-spacing: 1px; padding: 4px 14px; cursor: pointer; border-radius: 6px; }
  .menu-item.selected, .menu-item:hover { background: #ff7a3d; }
  .start-saves { display: flex; flex-direction: column; gap: 8px; max-width: 560px; }
  .save-slot { background: rgba(16,20,26,0.8); border: 1px solid rgba(255,255,255,0.12); border-radius: 8px; padding: 10px 14px; }
  .save-slot b { font-size: 14px; }
  .save-slot span { display: block; font-size: 12px; color: #c8c8c2; margin-top: 2px; }
  .save-slot.empty { opacity: 0.65; }
  .start-foot { position: absolute; bottom: 18px; left: 8%; font-size: 12px; color: rgba(255,255,255,0.7); }

  /* Pause menu */
  #pause-menu { position: absolute; inset: 0; background: rgba(8, 10, 14, 0.88); display: flex; flex-direction: column; align-items: center; padding: 26px; pointer-events: auto; }
  .pause-head { width: 1020px; display: flex; justify-content: space-between; align-items: center; font-size: 22px; font-weight: bold; margin-bottom: 14px; }
  .pause-head b { color: #ffd21f; }
  #pause-clock { font-size: 13px; font-weight: normal; color: #d8d8d2; }
  .pause-tabs { width: 1020px; display: flex; gap: 8px; margin-bottom: 12px; }
  .pause-tab { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); color: #fff; font-family: inherit; font-size: 14px; font-weight: bold; padding: 8px 18px; border-radius: 6px; cursor: pointer; }
  .pause-tab.selected { background: #ffd21f; color: #111; }
  .pause-body { width: 1020px; display: flex; gap: 16px; background: rgba(16,20,26,0.9); border: 1px solid rgba(255,255,255,0.12); border-radius: 12px; padding: 16px; }
  .pause-map-col { flex-shrink: 0; }
  #pause-map { border-radius: 8px; display: block; }
  .pause-map-foot { font-size: 11px; color: #9a9a92; margin-top: 8px; text-align: center; }
  .pause-side { flex: 1; }
  .pause-side-title { color: #ffd21f; font-weight: bold; font-size: 15px; margin-bottom: 8px; }
  .pause-side-text { font-size: 13px; line-height: 1.5; color: #d8d8d2; }
  .legend { margin: 14px 0; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
  .legend .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 8px; vertical-align: middle; }
  .dot.yellow { background: #ffd21f; } .dot.white { background: #fff; } .dot.red { background: #ff3b30; }
  .dot.orange { background: #ff9500; } .dot.green { background: #7fb069; } .dot.coral { background: #ff8a7a; }
  .pause-tip { font-size: 12px; color: #9fd4e8; line-height: 1.45; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 12px; }
  .pause-stats { display: flex; gap: 18px; margin-top: 16px; }
  .pause-stats div { text-align: center; }
  .pause-stats b { display: block; font-size: 20px; color: #ffd21f; }
  .pause-stats span { font-size: 10px; color: #9a9a92; }
  .resume-btn { margin-top: 16px; background: #ffd21f; border: none; color: #111; font-family: inherit; font-size: 16px; font-weight: bold; padding: 12px 42px; border-radius: 8px; cursor: pointer; }
</style>
</head>
<body>
<div id="app"></div>
<div id="hud"></div>
<script src="vendor/three.min.js"></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
